version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: reality_root
      MYSQL_DATABASE: qbcore
      MYSQL_USER: reality
      MYSQL_PASSWORD: reality_pass
    ports:
      - '3307:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

volumes:
  mariadb_data:
  redis_data:
